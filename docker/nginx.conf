# Statisches Ausliefern des Taskpanes.
#
# Die Sicherheitsrichtlinie muss mit der in `vercel.json` uebereinstimmen —
# `tests/taskpane-csp.test.mjs` prueft das. Grund: die Richtlinie entscheidet,
# welche Adressen das Add-in ueberhaupt aufrufen darf, und ein Fehler darin
# zeigt sich erst in Produktion als "nichts funktioniert".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Office laedt das Taskpane unter genau diesem Pfad — er steht so im
    # Manifest und wird vom Vite-Build auch so ausgegeben.
    location = /src/taskpane.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob: https://appsforoffice.microsoft.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://appsforoffice.microsoft.com https://cdn.jsdelivr.net https://gruenerator.eu https://beta.gruenerator.eu https://localhost:* https://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Gehashte Build-Artefakte sind unveraenderlich.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
