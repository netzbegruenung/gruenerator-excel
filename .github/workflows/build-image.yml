name: Build and Push Image

# Baut das Taskpane-Image und schiebt es nach ghcr. Der Rollout passiert
# ausserhalb dieses Repos: der Salt-State `gruenerator-docker` zieht das Image
# auf den Host — dieselbe Strecke wie `doku`.

on:
  push:
    branches: [gruenerator]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Erst die Pruefungen, dann das Image. Ein Build, der die CSP-Parität
      # verletzt, darf gar nicht erst in der Registry landen — der Fehler
      # zeigte sich sonst erst beim Rollout.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/netzbegruenung/gruenerator-excel:latest
            ghcr.io/netzbegruenung/gruenerator-excel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
