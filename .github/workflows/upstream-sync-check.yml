name: Upstream sync check

# This repo shares real git history with tmustier/pi-for-excel (cloned +
# repointed, not a GitHub-native fork, so there's no "Sync fork" button —
# see docs/upstream-sync.md). That means a real `git merge upstream/main` is
# possible and preferred over hand-porting. This watches for new upstream
# commits past our merge-base and either opens a mergeable PR directly, or
# — if it conflicts — files a tracking issue for manual resolution.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gruenerator

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"

      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync \
            --color "0E8A16" \
            --description "New commits on tmustier/pi-for-excel awaiting sync" \
            --force

      - name: Skip if a sync PR or tracking issue is already open
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh pr list --label upstream-sync --state open --json number --jq 'length')
          open_issues=$(gh issue list --label upstream-sync --state open --json number --jq 'length')
          echo "skip=$([ "$open_prs" != "0" ] || [ "$open_issues" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream
        if: steps.existing.outputs.skip == 'false'
        run: |
          git remote add upstream https://github.com/tmustier/pi-for-excel.git
          git fetch upstream main

      - name: Diff against merge-base
        if: steps.existing.outputs.skip == 'false'
        id: diff
        run: |
          base="$(git merge-base HEAD upstream/main)"
          log="$(git log "${base}..upstream/main" --pretty=format:'- %h %s (%an, %ad)' --date=short)"
          {
            echo "log<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list "${base}..upstream/main" --count)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on a sync branch
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.count != '0'
        id: merge
        run: |
          branch="upstream-sync/$(date -u +%Y-%m-%d)-${{ steps.diff.outputs.head }}"
          branch="${branch:0:60}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if git merge upstream/main --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            git push origin "$branch"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Open PR for a clean merge
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.count != '0' && steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/body.md <<BODY
          Clean \`git merge upstream/main\` from [tmustier/pi-for-excel](https://github.com/tmustier/pi-for-excel) — ${{ steps.diff.outputs.count }} commit(s):

          ${{ steps.diff.outputs.log }}

          No conflicts, but **review before merging**: check each commit against [docs/upstream-divergences.md](https://github.com/${{ github.repository }}/blob/gruenerator/docs/upstream-divergences.md) — a clean textual merge can still silently reintroduce something we deliberately diverged on (e.g. the pi-web-ui removal, the Grünerator gateway). CI + the required review on \`gruenerator\` still gate this like any other PR.
          BODY
          gh pr create \
            --base gruenerator \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Merge upstream: ${{ steps.diff.outputs.count }} commit(s) from tmustier/pi-for-excel" \
            --label upstream-sync \
            --body-file /tmp/body.md

      - name: File tracking issue on conflict
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.count != '0' && steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/body.md <<BODY
          [tmustier/pi-for-excel](https://github.com/tmustier/pi-for-excel) has ${{ steps.diff.outputs.count }} commit(s) past our merge-base, but \`git merge upstream/main\` conflicts and needs manual resolution:

          [Compare ${{ steps.diff.outputs.base }}...${{ steps.diff.outputs.head }}](https://github.com/tmustier/pi-for-excel/compare/${{ steps.diff.outputs.base }}...${{ steps.diff.outputs.head }})

          ${{ steps.diff.outputs.log }}

          ### How to resolve
          1. \`git remote add upstream https://github.com/tmustier/pi-for-excel.git\` (if not already), \`git fetch upstream main\`
          2. \`git checkout -b upstream-sync/manual gruenerator && git merge upstream/main\`
          3. Resolve conflicts — cross-check [docs/upstream-divergences.md](https://github.com/${{ github.repository }}/blob/gruenerator/docs/upstream-divergences.md) for anything that should stay as our version
          4. Open a PR, let CI + review gate it as usual, close this issue once merged

          This issue was filed automatically by [upstream-sync-check.yml](https://github.com/${{ github.repository }}/blob/gruenerator/.github/workflows/upstream-sync-check.yml) and won't be duplicated while an \`upstream-sync\`-labeled issue or PR stays open.
          BODY
          gh issue create \
            --title "Upstream sync: merge conflict with tmustier/pi-for-excel (${{ steps.diff.outputs.count }} commits)" \
            --label upstream-sync \
            --body-file /tmp/body.md
